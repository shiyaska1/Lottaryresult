name: Build APK & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone - build.gradle.kts derives versionCode
      # from the commit count, which a shallow clone would report as 1 every time.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Set release tag
        id: ver
        run: |
          CODE=$(git rev-list --count HEAD)
          echo "tag=v1.0.$CODE" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Lottery Result Print ${{ steps.ver.outputs.tag }}"
          files: app/build/outputs/apk/debug/app-debug.apk
